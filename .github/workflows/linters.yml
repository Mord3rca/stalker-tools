
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: 'Linters'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install shellcheck
        run: sudo apt install shellcheck
      - name: Shellcheck
        run: shellcheck utils/scripts/*
      - name: Checkpatch
        run: |
          mapfile -t sources < <(find . -name '*.[ch]')
          .github/scripts/checkpatch.pl --file "${sources[@]}"
